# =============================================================================
# Netlify configuration
# =============================================================================

[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js runtime. Handles the App Router, server actions,
# middleware, and route handlers.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# next/image is served through Netlify's image CDN, which — unlike Next's own
# optimiser — needs remote hosts allowing here as well as in next.config.ts.
# This is the bucket Tausha's photo and any room photos are served from.
[images]
  remote_images = [
    "https://.*\\.supabase\\.co/storage/v1/object/public/.*"
  ]

[functions]
  node_bundler = "esbuild"

# Local `netlify dev`, if you ever use it. The app's own port is 4300.
[dev]
  command = "npm run dev"
  targetPort = 4300
  framework = "#custom"

# The service worker must never be served from a CDN cache. A stale sw.js is
# how a site gets stuck serving yesterday's pages to people who cannot clear
# it themselves — the browser would keep handing out the old worker, and the
# old worker keeps handing out the old cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# The manifest changes rarely but should still be re-checked on each visit,
# so a new icon or name reaches people who already installed it.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons are content-stable and safe to keep for a long time.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
